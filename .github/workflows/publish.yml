name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  # Allow manual re-runs of a failed publish.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    # Only ever publish from a v* tag — never on a branch push (e.g. master).
    if: github.repository_owner == 'heartmove' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # The lockfile and exact dev dependencies target DSH 0.1.7-alpha.1.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Resolve package version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Sync version
        run: |
          node -e "
            const fs=require('fs');
            const tag='${{ steps.version.outputs.version }}';
            const p=JSON.parse(fs.readFileSync('package.json','utf8'));
            const m=JSON.parse(fs.readFileSync('dsh.plugin.json','utf8'));
            p.version=tag; m.version=tag;
            fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
            fs.writeFileSync('dsh.plugin.json',JSON.stringify(m,null,2)+'\n');
          "

      # A prerelease tag (v0.3.2-alpha.1) must NOT be published onto `latest`:
      # that dist-tag is what `npm install dsh-session-bridge` and
      # `dsh plugin add` resolve, so an alpha would silently replace the stable
      # release for every user. Prereleases go to their own channel (alpha/beta/
      # rc), plain versions keep `latest`.
      - name: Resolve npm dist-tag
        id: disttag
        shell: bash
        run: |
          version='${{ steps.version.outputs.version }}'
          tag='latest'
          case "$version" in
            *-*) tag="${version#*-}"; tag="${tag%%.*}" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publishing $version under dist-tag '$tag'"

      - name: Publish to npm
        run: pnpm publish --no-git-checks --access public --provenance --tag ${{ steps.disttag.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
