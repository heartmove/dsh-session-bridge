name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    name: Install, typecheck, build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
          run_install: false

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      # The lockfile and exact dev dependencies target DSH 0.1.7-rc.1.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Regression tests for the wait/stall core logic (issue #1). They import
      # src/core.ts directly via Node type stripping — no build step required.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # The artifact itself must mount: check:compat proves provenance, not loadability.
      - name: Smoke test the built bundle
        run: pnpm smoke

      - name: Pack
        run: pnpm pack --pack-destination .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-session-bridge-${{ matrix.node-version }}
          path: |
            dsh-session-bridge-*.tgz
            lib/
          if-no-files-found: ignore
