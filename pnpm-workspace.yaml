# `minimumReleaseAgeExclude` only matters when a `minimumReleaseAge` policy is
# configured; the entries below keep the DSH release train installable the day it
# is published. They name packages WITHOUT versions on purpose: pinning a
# version here re-introduces exactly the staleness this repo avoids everywhere
# else (a new harness release would be blocked at install time). Cordis and
# schemastery are versioned independently of DSH, so they stay pinned.
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis-plugin-group@1.0.3'
  - '@deepseek-ai/cordis-plugin-include@1.0.8'
  - '@deepseek-ai/cordis-plugin-loader@1.0.4'
  - '@deepseek-ai/cordis@4.0.3'
  - '@deepseek-ai/cosmokit@1.8.4'
  - '@deepseek-ai/schemastery@3.18.3'
  - '@deepseek-ai/dsh-agent'
  - '@deepseek-ai/dsh-agent-preset-registry'
  - '@deepseek-ai/dsh-app-boot'
  - '@deepseek-ai/dsh-atomic-write'
  - '@deepseek-ai/dsh-attachment'
  - '@deepseek-ai/dsh-brand'
  - '@deepseek-ai/dsh-commands'
  - '@deepseek-ai/dsh-compaction'
  - '@deepseek-ai/dsh-compaction-image-offload'
  - '@deepseek-ai/dsh-config-editor'
  - '@deepseek-ai/dsh-home-paths'
  - '@deepseek-ai/dsh-invariants'
  - '@deepseek-ai/dsh-launch-environment'
